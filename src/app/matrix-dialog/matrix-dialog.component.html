<h2 mat-dialog-title>Change Matrix</h2>

<mat-dialog-content [formGroup]="form">
  
    <mat-form-field>
        <input matInput
                placeholder="X Value: "
               formControlName="xValue">
    </mat-form-field>
    <br>
    <mat-form-field>
        <input matInput
                placeholder="Y Value: "
               formControlName="yValue">
    </mat-form-field>
    <div>
      Warning: Changing the Matrix Size will Clear the Board!
      <br>
    </div>
</mat-dialog-content>

<mat-dialog-actions>
    <button class="mat-raised-button" (click)="close()">Close</button>
    <button class="mat-raised-button mat-primary" (click)="save()">Save</button>
</mat-dialog-actions>
